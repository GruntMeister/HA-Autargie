name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check custom_components tests
      - run: python -m pytest tests/test_calc.py -q
      - run: python -m json.tool custom_components/sonnen_autarky/manifest.json > /dev/null
      - run: python -m json.tool custom_components/sonnen_autarky/strings.json > /dev/null
      - run: python -m json.tool custom_components/sonnen_autarky/translations/de.json > /dev/null
      - run: python -m json.tool custom_components/sonnen_autarky/translations/en.json > /dev/null
      - run: python -m json.tool hacs.json > /dev/null
